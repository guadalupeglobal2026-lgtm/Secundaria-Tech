<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de calificaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fa;--card:#fff;--ink:#14213d;--muted:#56637a;--line:#d5deeb;--acc:#14213d;--ok:#1b7a3a;--oks:#e5f2e6;--mid:#8a5a00;--mids:#fdf1d8;--bad:#b42323;--bads:#fbe8e8;--head:#e7effb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--muted:#a9b3c9;--line:#2c3a58;--acc:#9cc3ff;--oks:#163626;--ok:#6fd38f;--mids:#3a2e14;--mid:#f2c94c;--bads:#3a1b1f;--bad:#ff9a9a;--head:#22304f}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--muted:#a9b3c9;--line:#2c3a58;--acc:#9cc3ff;--oks:#163626;--ok:#6fd38f;--mids:#3a2e14;--mid:#f2c94c;--bads:#3a1b1f;--bad:#ff9a9a;--head:#22304f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
.logo{display:block;width:130px;margin:0 auto 6px}
.center{text-align:center}
h1{font-weight:900;font-size:clamp(26px,5vw,38px);margin:6px 0 4px}
h2{font-weight:800;font-size:21px;margin:0 0 10px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}
label span{display:block;font-weight:700;margin-bottom:6px;font-size:15px}
input,select{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-weight:600;margin:10px 0 0}
.msg.err{color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--card)}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--head);font-size:14px;position:sticky;top:0}
td.n,th.n{text-align:center;white-space:nowrap}
.pill{display:inline-block;min-width:48px;text-align:center;border-radius:999px;padding:2px 10px;font-weight:800}
.p-ok{background:var(--oks);color:var(--ok)}.p-mid{background:var(--mids);color:var(--mid)}.p-bad{background:var(--bads);color:var(--bad)}.p-none{color:var(--muted)}
.det td{background:var(--bg)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mod{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.mod b{display:block;margin-bottom:4px}
.tm{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;border-top:1px dashed var(--line)}
.legend{font-size:14px}
@media (max-width:760px){.form{grid-template-columns:1fr 1fr}}
@media print{.noprint{display:none}body{background:#fff}.card{border:0;padding:0}}
</style>
</head>

s digitales","e":3},{"c":"A4","n":"Reto: Auditoría de seguridad","e":1}]},{"l":"B","n":"IA aplicada","t":[{"c":"B1","n":"Uso guiado para investigar","e":3},{"c":"B2","n":"Verificación de resultados","e":3},{"c":"B3","n":"Declaración de uso de IA","e":2},{"c":"B4","n":"Entrena un modelo de IA","e":3},{"c":"B5","n":"Reto: La IA bajo la lupa","e":1}]},{"l":"C","n":"Hojas de cálculo III","t":[{"c":"C1","n":"SUMAR.SI y PROMEDIO.SI","e":3},{"c":"C2","n":"Búsqueda con BUSCARV","e":3},{"c":"C3","n":"Validación de datos","e":3},{"c":"C4","n":"Tablas dinámicas","e":3},{"c":"C5","n":"Reto: El reporte de la cooperativa","e":1}]},{"l":"D","n":"Emprendimiento digital","t":[{"c":"D1","n":"Modelo de negocio","e":3},{"c":"D2","n":"Presupuesto y punto de equilibrio","e":3},{"c":"D3","n":"Estrategia de venta","e":3},{"c":"D4","n":"Sustentabilidad y evaluación del producto","e":3},{"c":"D5","n":"Reto: El pitch del emprendimiento","e":1}]},{"l":"E","n":"Programación con Python","t":[{"c":"E1","n":"Variables, entrada y salida","e":3},{"c":"E2","n":"Condicionales y ciclos","e":3},{"c":"E3","n":"Listas y funciones","e":3},{"c":"E4","n":"Reto: La calculadora de calificaciones","e":1}]},{"l":"F","n":"Portafolio web y proyectos","t":[{"c":"F1","n":"Estructura con HTML","e":3},{"c":"F2","n":"Estilo con CSS","e":3},{"c":"F3","n":"Interactividad con JavaScript","e":3},{"c":"F4","n":"Reto: La página del club","e":1}]},{"l":"G","n":"Orientación vocacional TIC","t":[{"c":"G1","n":"Perfiles profesionales","e":2},{"c":"G2","n":"Rutas de bachillerato","e":2},{"c":"G3","n":"Entrevista informativa","e":2},{"c":"G4","n":"Reto: Mi ruta","e":1}]},{"l":"H","n":"Integrador final","t":[{"c":"H1","n":"Síntesis del trayecto","e":2},{"c":"H2","n":"Presentación pública","e":2}]}]};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const normG = (s) => String(s || '').toUpperCase().replace(/[^0-9A-ZÑ]/g, '');
const pill = (v, scale10) => { if (v === null || v === undefined || v === '') return '<span class="pill p-none">—</span>'; const c = v >= 80 ? 'p-ok' : v >= 60 ? 'p-mid' : 'p-bad'; return `<span class="pill ${c}">${scale10 ? (Math.round(v) / 10).toFixed(1) : Math.round(v) + '%'}</span>`; };
let last = null;
$('#gp').addEventListener('input', (e) => { e.target.value = normG(e.target.value); });
const calc = (g, a) => {
  const mods = OUT[g]; let sum = 0, tot = 0, comp = 0, ini = 0; const temas = {};
  mods.forEach((m) => m.t.forEach((t) => { let s = 0, hechos = 0, done = true;
    for (let i = 1; i <= t.e; i++) { const v = a.prog[`${t.c}.${i}`]; const b = v ? +v[0] : 0; s += b; if (v && v[1]) hechos++; if (b < 80) done = false; }
    sum += s; tot += t.e; if (done) comp++; if (hechos) ini++; temas[t.c] = { prom: hechos ? s / t.e : null, hechos, e: t.e }; }));
  const ntemas = mods.reduce((x, m) => x + m.t.length, 0);
  return { avance: tot ? sum / tot : 0, comp, ini, ntemas, temas };
};
async function consultar() {
  const g = $('#gr').value, gp = normG($('#gp').value), q = $('#nm').value.trim(), pw = $('#pw').value, m = $('#m');
  if (!pw) { m.className = 'msg err'; m.textContent = 'Escribe tu contraseña docente.'; return; }
  if (!REPORT_URL) { m.className = 'msg err'; m.textContent = 'Esta página no está conectada a tu hoja.'; return; }
  if (navigator.onLine === false) { m.className = 'msg err'; m.textContent = 'Se necesita internet para consultar tu hoja.'; return; }
  $('#go').disabled = true; m.className = 'msg'; m.textContent = 'Consultando tu hoja…';
  try {
    const d = await fetch(`${REPORT_URL}?accion=relacion&clave=${encodeURIComponent(pw)}&grado=${encodeURIComponent(g + '°')}&grupo=${encodeURIComponent(gp)}&q=${encodeURIComponent(q)}`).then((r) => r.json());
    $('#go').disabled = false;
    if (!d || !d.ok) { m.className = 'msg err'; m.textContent = (d && d.msg) || 'No se pudo consultar.'; return; }
    const L = (d.alumnos || []).map((a) => Object.assign({}, a, { c: calc(g, a) })).sort((x, y) => x.grupo.localeCompare(y.grupo) || x.alumno.localeCompare(y.alumno, 'es'));
    last = { g, gp, L };
    m.className = 'msg'; m.textContent = L.length ? `${L.length} alumno${L.length === 1 ? '' : 's'} de ${g}°${gp ? ' · grupo ' + gp : ''}.` : 'No hay calificaciones registradas con esos datos. Si tus alumnos ya trabajaron, deben abrir su simulador una vez con internet para que se envíen.';
    render();
  } catch (e) {
    $('#go').disabled = false; m.className = 'msg err';
    m.textContent = 'No se pudo conectar con tu hoja. Revisa en Apps Script que la implementación tenga acceso «Cualquier persona» y el código más reciente.';
  }
}
function render() {
  const { g, L } = last; if (!L.length) { $('#res').innerHTML = ''; return; }
  const n = OUT[g].reduce((x, m) => x + m.t.length, 0);
  $('#res').innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2>Relación de calificaciones · ${g}° de secundaria</h2><div class="row noprint"><button class="btn ghost sm" id="csv">⬇️ Descargar en Excel</button><button class="btn ghost sm" id="prn">🖨️ Imprimir</button></div></div>
  <p class="muted legend"><b>Avance</b>: promedio de la calificación más alta de todos los ejercicios del simulador (los que no ha hecho cuentan como 0). <b>Temas</b>: completados con 80 % o más en todos sus ejercicios. <b>Examen</b>: sobre 10.</p>
  <div class="tw"><table><thead><tr><th class="n">#</th><th>Alumno</th><th class="n">Grupo</th><th class="n">Avance</th><th class="n">Temas completados</th><th class="n">Temas iniciados</th><th class="n">Examen</th><th class="n">Última actividad</th><th class="n noprint"></th></tr></thead><tbody>
  ${L.map((a, i) => `<tr><td class="n">${i + 1}</td><td><b>${esc(a.alumno)}</b></td><td class="n">${esc(a.grupo)}</td><td class="n"><b>${Math.round(a.c.avance)}%</b></td><td class="n">${a.c.comp} de ${n}</td><td class="n">${a.c.ini}</td><td class="n">${a.examen === null ? '<span class="pill p-none">—</span>' : pill(a.examen, true)}</td><td class="n muted">${esc(String(a.ultima).slice(0, 16))}</td><td class="n noprint"><button class="btn sm" data-d="${i}">Ver temas</button></td></tr><tr class="det" id="det${i}" hidden><td colspan="9"></td></tr>`).join('')}
  </tbody></table></div></div>`;
  document.querySelectorAll('[data-d]').forEach((b) => b.addEventListener('click', () => { const i = +b.dataset.d; const tr = $('#det' + i); if (!tr.hidden) { tr.hidden = true; b.textContent = 'Ver temas'; return; } const a = L[i];
    tr.firstElementChild.innerHTML = `<div class="mods">${OUT[g].map((m) => `<div class="mod"><b>${m.l}. ${esc(m.n)}</b>${m.t.map((t) => { const x = a.c.temas[t.c]; return `<div class="tm"><span>${t.c} · ${esc(t.n)}</span><span>${x.hechos ? pill(x.prom) : '<span class="pill p-none">—</span>'}</span></div>`; }).join('')}</div>`).join('')}</div>`;
    tr.hidden = false; b.textContent = 'Ocultar'; }));
  $('#prn').addEventListener('click', () => { document.querySelectorAll('.det').forEach((t) => { t.hidden = true; }); window.print(); });
  $('#csv').addEventListener('click', descargar);
}
function descargar() {
  const { g, gp, L } = last; const temas = OUT[g].flatMap((m) => m.t);
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Alumno', 'Grupo', 'Avance (%)', 'Temas completados', 'Temas iniciados', 'Examen (0-10)', 'Última actividad'].concat(temas.map((t) => `${t.c} ${t.n}`))];
  L.forEach((a) => rows.push([a.alumno, a.grupo, Math.round(a.c.avance), a.c.comp, a.c.ini, a.examen === null ? '' : (Math.round(a.examen) / 10).toFixed(1), a.ultima].concat(temas.map((t) => { const x = a.c.temas[t.c]; return x.hechos ? Math.round(x.prom) : ''; }))));
  const csv = '﻿' + rows.map((r) => r.map(q).join(',')).join('\r\n');
  const el = document.createElement('a'); el.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  el.download = `Relacion_calificaciones_${g}_${gp || 'todos'}.csv`; document.body.appendChild(el); el.click(); setTimeout(() => { URL.revokeObjectURL(el.href); el.remove(); }, 1000);
}
$('#go').addEventListener('click', consultar);
$('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') consultar(); });
})();
