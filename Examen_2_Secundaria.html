<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen de Tecnología · 2° de secundaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fa;--card:#fff;--ink:#14213d;--muted:#56637a;--line:#d5deeb;--acc:#2D8034;--accs:#E8F2E9;--ok:#1b7a3a;--oks:#e5f2e6;--bad:#b42323;--bads:#fbe8e8;--sel:#e7effb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--muted:#a9b3c9;--line:#2c3a58;--accs:#22304f;--oks:#163626;--ok:#6fd38f;--bads:#3a1b1f;--bad:#ff9a9a;--sel:#22304f}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--muted:#a9b3c9;--line:#2c3a58;--accs:#22304f;--oks:#163626;--ok:#6fd38f;--bads:#3a1b1f;--bad:#ff9a9a;--sel:#22304f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:24px 16px 60px}
h1{font-weight:900;font-size:clamp(26px,5vw,38px);line-height:1.15;margin:8px 0 6px}
h2{font-weight:800;font-size:22px;margin:0 0 10px}
.logo{display:block;width:150px;height:auto;margin:0 auto 6px}
.center{text-align:center}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 2px 0 var(--line)}
.tag{display:inline-block;background:var(--acc);color:#fff;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 14px}
ul.rules{margin:8px 0 0;padding-left:22px}
ul.rules li{margin:6px 0}
label.fld{display:block;margin:14px 0}
label.fld span{display:block;font-weight:700;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
.btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:14px 22px;cursor:pointer;background:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{font-size:15px;padding:9px 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.msg{margin:10px 0 0;font-weight:600;color:var(--bad)}
.msg.ok{color:var(--ok)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.bar .who{font-weight:700}
.prog{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.q{scroll-margin-top:110px}
.q .num{font-weight:900;color:var(--acc);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.q .txt{font-weight:700;font-size:19px;margin:6px 0 14px}
.q.miss{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:17px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--sel)}
.opt[aria-pressed="true"] .l{background:var(--acc);border-color:var(--acc);color:#fff}
.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
pre.code{font-family:Consolas,"Courier New",monospace;font-size:17px;background:var(--sel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;white-space:pre-wrap}
code,.mono{font-family:Consolas,"Courier New",monospace;font-size:.95em}
.score{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
.big{font-size:64px;font-weight:900;line-height:1;color:var(--acc)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.mod{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mod b{display:block}
.rev{border-left:6px solid var(--bad)}
.rev.good{border-left-color:var(--ok)}
.ans{border-radius:10px;padding:8px 12px;margin:6px 0;font-weight:600}
.ans.bad{background:var(--bads);color:var(--bad)}
.ans.ok{background:var(--oks);color:var(--ok)}
.exp{margin:8px 0 0}
.confirm{border:2px solid var(--acc);background:var(--accs)}
footer{margin-top:30px;text-align:center}
#doc{max-width:520px;margin:12px auto 0;text-align:left}
@media (max-width:560px){body{font-size:16px}.card{padding:16px}.big{font-size:52px}}
@media print{.bar,footer,.noprint{display:none}body{background:#fff}}
</style>
</head>

const LET = 'ABCD';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'techkids-examen-sec' + G.n;
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
store.done = store.done || {}; store.prog = store.prog || {}; store.outbox = store.outbox || []; store.resetsDone = store.resetsDone || [];
if (!store.dev) store.dev = 'E' + Math.random().toString(36).slice(2, 8);
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* */ } };
persist();
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const normGrupo = (s) => String(s || '').toUpperCase().replace(/[^0-9A-ZÑ]/g, '');
const keyOf = (name, grupo) => norm(name) + '|' + normGrupo(grupo);
const nowStamp = () => { const d = new Date(); const p = (x) => String(x).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
const online = () => !!REPORT_URL && !(navigator.onLine === false);

/* orden propio para cada alumno: preguntas y opciones revueltas con una semilla de su nombre */
const seedOf = (s) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const shuffle = (arr, r) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- envío a la hoja de la maestra ---------- */
let sending = false;
const flush = () => new Promise((res) => {
  if (!REPORT_URL || sending || !store.outbox.length || navigator.onLine === false) { res(!store.outbox.length); return; }
  sending = true; const batch = store.outbox.slice(0, 50);
  fetch(REPORT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rows: batch }) })
    .then(() => { store.outbox = store.outbox.slice(batch.length); persist(); sending = false; res(!store.outbox.length); })
    .catch(() => { sending = false; res(false); });
});
const report = (row) => { if (!REPORT_URL) return Promise.resolve(false); store.outbox.push(row); persist(); return flush(); };
window.addEventListener('online', () => flush());
/* exámenes presentados con la versión anterior: sus respuestas se quedaron en esta computadora; se envían a la hoja */
const recuperar = () => { if (!REPORT_URL) return; let n = 0;
  Object.values(store.done).forEach((r) => { if (r.rsent || !r.ans || !r.order) return; r.rsent = true; n++;
    const byId = {}; QS.forEach((q) => { byId[q.id] = q; }); const porMod = {}; r.order.forEach((id) => { const m = byId[id].t[0]; const o = porMod[m] || (porMod[m] = [0, 0]); o[1]++; if (r.ans[id] === 0) o[0]++; });
    const fallos = r.order.filter((id) => r.ans[id] !== 0).map((id) => byId[id].t).sort();
    const texto = `Aciertos ${r.ok}/${r.tot} · Calificación ${(r.ok / r.tot * 10).toFixed(1)} · Por módulo: ${Object.keys(porMod).sort().map((m) => `${m} ${porMod[m][0]}/${porMod[m][1]}`).join(', ')}${fallos.length ? ` · Falló en los temas: ${fallos.join(', ')}` : ''}${r.blur ? ` · Salió de la página ${r.blur} ${r.blur === 1 ? 'vez' : 'veces'}` : ''} · Respuestas recuperadas de esta computadora · R:${QS.map((q) => (r.ans[q.id] === undefined ? 'x' : r.ans[q.id])).join('')}`;
    store.outbox.push({ fecha: r.fecha, grado: G.short, grupo: r.grupo, alumno: r.name, tema: 'EX', temaNombre: 'Examen', ejercicio: 'EXAMEN', titulo: `Examen de ${G.short} (${r.tot} preguntas)`, calif: r.pct, intento: 1, mejor: r.pct, promTema: r.pct, temasComp: '', totalTemas: '', tipo: 'Examen', dev: store.dev, texto }); });
  if (n) persist(); };
recuperar();
setTimeout(flush, 800);
const pull = (name, grupo) => {
  if (!online()) return Promise.resolve(null);
  const q = `alumno=${encodeURIComponent(name)}&grupo=${encodeURIComponent(grupo)}&grado=${encodeURIComponent(G.short)}`;
  return Promise.race([fetch(`${REPORT_URL}?${q}`).then((r) => r.json()), new Promise((r) => setTimeout(() => r(null), 8000))]).catch(() => null);
};
/* reinicio del examen hecho por la docente (desde la hoja, desde un simulador o desde este examen) */
const applyResets = (d, k) => { let ch = false; ((d && d.resets) || []).forEach((x) => { if (x.ej !== 'EXAMEN' || store.resetsDone.includes(x.id)) return; store.resetsDone.push(x.id); if (store.done[k]) { delete store.done[k]; ch = true; } if (store.prog[k]) { delete store.prog[k]; ch = true; } }); if (ch) persist(); return ch; };
let cur = null; let last = { name: '', grupo: '' };

async function comenzar() {

let bound = false;

  <div class="card" id="fin"><h2>Entregar examen</h2><p class="muted">Revisa tus respuestas antes de entregar. Solo tienes un intento.</p><div class="row"><button type="button" class="btn" id="ent">Entregar examen</button></div><p class="msg" id="fm"></p><div id="conf"></div></div>`;
  const upd = () => { const n = Object.keys(c.ans).length; $('#cnt').textContent = `Respondidas: ${n} de ${c.order.length}`; $('#pb').style.width = (n / c.order.length * 100) + '%'; if (n === c.order.length && $('#fm')) $('#fm').textContent = ''; };

function entregar() {
  const c = cur; if (!c) return; const byId = {}; QS.forEach((q) => { byId[q.id] = q; });
  const ok = c.order.filter((id) => c.ans[id] === 0).length; const tot = c.order.length; const pct = Math.round(ok / tot * 100);
  const porMod = {}; c.order.forEach((id) => { const m = byId[id].t[0]; const o = porMod[m] || (porMod[m] = [0, 0]); o[1]++; if (c.ans[id] === 0) o[0]++; });
  const fallos = c.order.filter((id) => c.ans[id] !== 0).map((id) => byId[id].t).sort();
  const fecha = nowStamp();
  store.done[c.key] = { name: c.name, grupo: c.grupo, fecha, ok, tot, pct, order: c.order, perm: c.perm, ans: c.ans, blur: c.blur || 0 };
  delete store.prog[c.key]; cur = null; persist();
  const texto = `Aciertos ${ok}/${tot} · Calificación ${(ok / tot * 10).toFixed(1)} · Por módulo: ${Object.keys(porMod).sort().map((m) => `${m} ${porMod[m][0]}/${porMod[m][1]}`).join(', ')}${fallos.length ? ` · Falló en los temas: ${fallos.join(', ')}` : ''}${c.blur ? ` · Salió de la página ${c.blur} ${c.blur === 1 ? 'vez' : 'veces'}` : ''} · Inició ${c.start} · R:${QS.map((q) => c.ans[q.id]).join('')}`;
  const row = { fecha, grado: G.short, grupo: c.grupo, alumno: c.name, tema: 'EX', temaNombre: 'Examen', ejercicio: 'EXAMEN', titulo: `Examen de ${G.short} (${tot} preguntas)`, calif: pct, intento: 1, mejor: pct, promTema: pct, temasComp: '', totalTemas: '', tipo: 'Examen', dev: store.dev, texto };
  store.done[c.key].sent = false; store.done[c.key].rsent = true; persist();
  resultado(c.key, report(row));
}

function resultado(k, sendP, rr, docente) {
  const r = rr || store.done[k]; if (!docente) last = { name: r.name, grupo: r.grupo };
  const tu_ = docente ? 'Respuesta del alumno' : 'Tu respuesta'; const byId = {}; QS.forEach((q) => { byId[q.id] = q; });
  const cal = (r.ok / r.tot * 10);
  const porMod = {}; r.order.forEach((id) => { const m = byId[id].t[0]; const o = porMod[m] || (porMod[m] = [0, 0]); o[1]++; if (r.ans[id] === 0) o[0]++; });
  const mal = r.order.map((id, i) => [id, i + 1]).filter(([id]) => r.ans[id] !== 0);
  const msg = cal >= 9 ? '¡Excelente trabajo!' : cal >= 8 ? '¡Muy bien!' : cal >= 6 ? 'Aprobaste. Repasa los temas que fallaste.' : 'Repasa los temas que fallaste con tu simulador y tu cuaderno.';
  const card = (id, i, good) => { const q = byId[id]; const tu = r.ans[id]; return `<section class="card rev${good ? ' good' : ''}"><div class="num" style="font-weight:900;color:var(--acc);font-size:15px;text-transform:uppercase">Pregunta ${i} · Tema ${q.t} · ${esc(MODS[q.t[0]] || '')}</div><p style="font-weight:700;margin:6px 0 8px">${esc(q.q)}</p>${q.c ? `<pre class="code">${esc(q.c)}</pre>` : ''}
    ${good ? `<div class="ans ok">✓ ${tu_}: ${esc(q.o[0])}</div>` : `<div class="ans bad">✗ ${tu_}: ${tu === undefined ? '(sin contestar)' : esc(q.o[tu])}</div><div class="ans ok">✓ Correcta: ${esc(q.o[0])}</div>`}
    <p class="exp">${esc(q.e)}${good ? '' : ` <span class="muted">Repasa el tema ${q.t} en tu simulador.</span>`}</p></section>`; };
  app.innerHTML = `<div class="center">${head()}<span class="tag">Examen · ${G.short} de secundaria</span><h1>${docente ? 'Respuestas del alumno' : 'Resultado del examen'}</h1>${docente ? '<p class="muted">Vista docente</p>' : ''}<p><b>${esc(r.name)}</b> · Grupo ${esc(r.grupo)} · ${esc(r.fecha)}</p></div>
  <div class="card"><div class="score"><div><div class="big">${cal.toFixed(1)}</div><div class="muted">Calificación</div></div><div><div class="big" style="font-size:44px">${r.ok}/${r.tot}</div><div class="muted">Aciertos</div></div></div>
  ${docente ? (r.extra ? `<p class="center muted">${esc(r.extra)}</p>` : '') : `<p class="center" style="font-weight:700;margin-top:14px">${msg}</p><p class="center muted" id="st">${REPORT_URL ? 'Enviando tu calificación…' : ''}</p>`}
  <h2 style="margin-top:18px">Aciertos por módulo</h2><div class="mods">${Object.keys(porMod).sort().map((m) => `<div class="mod"><b>${m}. ${esc(MODS[m] || '')}</b>${porMod[m][0]} de ${porMod[m][1]}</div>`).join('')}</div></div>
  ${docente ? `<div class="row noprint" style="justify-content:center"><button type="button" class="btn ghost" id="back">← Volver a la búsqueda</button><button type="button" class="btn ghost" id="prn">🖨️ Imprimir</button></div><h2 style="margin-top:20px">Todas sus respuestas (${mal.length} incorrectas)</h2>${r.order.map((id, i) => card(id, i + 1, r.ans[id] === 0)).join('')}<div class="row noprint" style="justify-content:center;margin-top:16px"><button type="button" class="btn" id="fin2">Cerrar vista docente</button></div>` : `${mal.length ? `<h2>Lo que fallaste (${mal.length})</h2>${mal.map(([id, i]) => card(id, i, false)).join('')}` : '<div class="card center"><b>¡No fallaste ninguna pregunta!</b></div>'}
  <div class="row noprint" style="justify-content:center;margin-top:16px"><button type="button" class="btn ghost" id="all">Ver todas mis respuestas</button><button type="button" class="btn" id="next">Terminar</button></div><div id="todas"></div>${foot()}`}`;
  if (docente) { $('#back').addEventListener('click', () => docente()); $('#prn').addEventListener('click', () => window.print()); $('#fin2').addEventListener('click', () => inicio()); window.scrollTo(0, 0); return; }
  bindDoc();
  $('#all').addEventListener('click', (e) => { e.currentTarget.remove(); $('#todas').innerHTML = `<h2 style="margin-top:20px">Todas tus respuestas</h2>${r.order.map((id, i) => card(id, i + 1, r.ans[id] === 0)).join('')}`; });
  $('#next').addEventListener('click', () => inicio());
  const st = $('#st');
  if (REPORT_URL && st) (sendP || flush()).then((ok) => { if (!document.body.contains(st)) return; st.textContent = ok || !store.outbox.some((x) => x.alumno === r.name && x.ejercicio === 'EXAMEN') ? '✓ Tu calificación se envió a tu maestra o maestro.' : 'Sin conexión: tu calificación se enviará sola cuando esta computadora tenga internet y se abra de nuevo el examen.'; });
  window.scrollTo(0, 0);
}

/* ---------- panel docente: permitir que un alumno vuelva a presentar ---------- */
const sha256 = (txt) => crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)).then((h) => [...new Uint8Array(h)].map((x) => x.toString(16).padStart(2, '0')).join(''));
const knownHash = () => { if (CLAVE_HASH) return CLAVE_HASH; if (store.claveHash) return store.claveHash; try { const s = JSON.parse(localStorage.getItem('techkids-sim-sec' + G.n) || '{}'); return (s && s.claveHash) || ''; } catch (e) { return ''; } };
let docClave = '';
function docPanel() {
  const pn = $('#doc'); if (!pn.hidden) { pn.hidden = true; pn.innerHTML = ''; return; }
  pn.hidden = false;
  pn.innerHTML = `<div class="card"><h2>Panel docente</h2><div class="row"><button type="button" class="btn" id="dver">📋 Ver respuestas de un alumno</button><button type="button" class="btn ghost" id="drei">↺ Reiniciar examen</button></div></div>`;
  $('#dver').addEventListener('click', () => verRespuestas());
  $('#drei').addEventListener('click', () => reiniciarPanel(pn));
}
/* ---------- vista docente: buscar a un alumno por su nombre y ver lo que contestó ---------- */
const parseR = (texto) => { const m = /R:([0-3x]+)/.exec(String(texto || '')); if (!m || m[1].length !== QS.length) return null; const ans = {}; QS.forEach((q, i) => { const v = m[1][i]; if (v !== 'x' && v !== 'u') ans[q.id] = +v; }); return ans; };
const matchName = (name, q) => { const w = norm(q).split(' ').filter(Boolean); const nn = norm(name); return w.every((x) => nn.includes(x)); };
function verRespuestas(prev) {
  const v = prev || {};
  app.innerHTML = `<div class="center">${head()}<span class="tag">Vista docente · ${G.short}</span><h1>Respuestas del examen</h1><p class="muted">Busca a un alumno por su nombre o por parte de él, o deja el nombre vacío para ver la lista completa.</p></div>
  <div class="card"><label class="fld"><span>Nombre del alumno (o parte: «López», «Ana»). Déjalo vacío para ver a todos</span><input type="text" id="bq" value="${esc(v.q || '')}"></label>
  <label class="fld"><span>Grupo (opcional)</span><input type="text" id="bg" maxlength="4" value="${esc(v.g || '')}"></label>
  <label class="fld"><span>Contraseña docente</span><input type="password" id="bc" autocomplete="off" value="${esc(docClave)}"></label>
  <div class="row"><button type="button" class="btn" id="bgo">Buscar</button><button type="button" class="btn ghost" id="bno">Salir</button></div><p class="msg" id="bm"></p></div><div id="bres"></div>`;
  $('#bno').addEventListener('click', () => { docClave = ''; inicio(); });
  $('#bg').addEventListener('input', (e) => { e.target.value = normGrupo(e.target.value); });
  const go = async () => {
    const q = $('#bq').value.trim(); const g = normGrupo($('#bg').value); const clave = $('#bc').value; const m = $('#bm');
    if (!clave) { m.className = 'msg'; m.textContent = 'Escribe la contraseña.'; return; }
    $('#bgo').disabled = true; m.className = 'msg ok'; m.textContent = 'Buscando…';
    const items = []; let srvOk = false;
    if (online()) {
      try {
        const d = await Promise.race([fetch(`${REPORT_URL}?accion=respuestas&clave=${encodeURIComponent(clave)}&grado=${encodeURIComponent(G.short)}&q=${encodeURIComponent(q)}&grupo=${encodeURIComponent(g)}`).then((r) => r.json()), new Promise((r) => setTimeout(() => r(null), 15000))]);
        if (d && d.ok === false) { m.className = 'msg'; m.textContent = d.msg || 'No se pudo consultar.'; $('#bgo').disabled = false; return; }
        if (d && d.ok) { srvOk = true; (d.items || []).forEach((x) => items.push({ name: x.alumno, grupo: x.grupo, fecha: x.fecha, pct: +x.calif || 0, texto: x.texto, ans: parseR(x.texto), src: 'Hoja' })); }
      } catch (e) { /* sin conexión: se busca en esta computadora */ }
    }
    if (!srvOk) { const h = knownHash(); if (!h || await sha256('TechKids-Sec·' + clave) !== h) { m.className = 'msg'; m.textContent = h ? 'Contraseña incorrecta.' : 'Sin conexión con la hoja y esta computadora no tiene guardada la contraseña docente.'; $('#bgo').disabled = false; return; } }
    docClave = clave;
    Object.values(store.done).forEach((r) => { if (!matchName(r.name, q) || (g && normGrupo(r.grupo) !== g)) return; if (items.some((x) => keyOf(x.name, x.grupo) === keyOf(r.name, r.grupo) && x.ans)) return; items.push({ name: r.name, grupo: r.grupo, fecha: r.fecha, pct: r.pct, ans: Object.assign({}, r.ans), local: r, src: 'Esta computadora' }); });
    $('#bgo').disabled = false;
    m.className = 'msg ok'; m.textContent = items.length ? `${items.length} resultado${items.length === 1 ? '' : 's'}${srvOk ? '' : ' (solo de esta computadora: no hay conexión con la hoja)'}.` : 'No se encontró ningún examen con ese nombre.';
    if (!items.length) { m.className = 'msg'; $('#bres').innerHTML = ''; return; }
    items.sort((a, b) => String(a.grupo).localeCompare(String(b.grupo)) || String(a.name).localeCompare(String(b.name)) || String(b.fecha).localeCompare(String(a.fecha)));
    $('#bres').innerHTML = items.map((x, i) => `<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(x.name)}</b> · Grupo ${esc(x.grupo)}<br><span class="muted">${esc(x.fecha)} · Calificación <b>${(Math.round(x.pct) / 10).toFixed(1)}</b> · ${esc(x.src)}</span></div>${x.ans ? `<button type="button" class="btn small" data-v="${i}">Ver respuestas</button>` : '<span class="muted">Presentado con la versión anterior del examen: solo hay resumen.</span>'}</div>${x.ans ? '' : `<p class="muted" style="margin:8px 0 0">${esc(String(x.texto || '').replace(/ · R:.*/, ''))}</p>`}</div>`).join('');
    $('#bres').querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => {
      const x = items[+b.dataset.v]; const order = QS.map((q2) => q2.id); const okN = order.filter((id) => x.ans[id] === 0).length;
      const extra = x.texto ? String(x.texto).split(' · ').filter((t) => /^Salió|^Inició/.test(t)).join(' · ') : (x.local && x.local.blur ? `Salió de la página ${x.local.blur} veces` : '');
      resultado(null, null, { name: x.name, grupo: x.grupo, fecha: x.fecha, ok: okN, tot: order.length, pct: x.pct, order, ans: x.ans, extra }, () => verRespuestas({ q: $('#bq') ? $('#bq').value : q, g }));
    }));
  };
  $('#bgo').addEventListener('click', go);
  if (v.q !== undefined && docClave) go(); else $('#bq').focus();
}
function reiniciarPanel(pn) {
  const c = cur || {};
  pn.innerHTML = `<div class="card"><h2>Reiniciar el examen de un alumno</h2><p class="muted">Úsalo solo si el alumno debe volver a presentarlo. Se usa la misma contraseña docente del simulador.</p>
  <label class="fld"><span>Nombre y apellidos del alumno</span><input type="text" id="dn" value="${esc(c.name || ($('#nom') && $('#nom').value) || last.name)}"></label>
  <label class="fld"><span>Grupo</span><input type="text" id="dg" maxlength="4" value="${esc(c.grupo || ($('#grp') && $('#grp').value) || last.grupo)}"></label>
  <label class="fld"><span>Contraseña docente</span><input type="password" id="dc" autocomplete="off"></label>
  <div class="row"><button type="button" class="btn" id="dgo">Reiniciar examen</button><button type="button" class="btn ghost" id="dno">Cancelar</button></div><p class="msg" id="dm"></p></div>`;
  $('#dno').addEventListener('click', () => { pn.hidden = true; pn.innerHTML = ''; });
  $('#dn').focus();
  $('#dgo').addEventListener('click', async () => {
    const name = $('#dn').value.trim().replace(/\s+/g, ' '); const grupo = normGrupo($('#dg').value); const clave = $('#dc').value; const m = $('#dm');
    if (name.length < 5 || !grupo) { m.textContent = 'Escribe el nombre completo y el grupo del alumno, como los escribió él.'; return; }
    if (!clave) { m.textContent = 'Escribe la contraseña.'; return; }
    const k = keyOf(name, grupo); $('#dgo').disabled = true; m.className = 'msg ok'; m.textContent = 'Verificando…';
    const listo = (txt) => { delete store.done[k]; delete store.prog[k]; if (cur && cur.key === k) cur = null; persist(); m.className = 'msg ok'; m.textContent = txt; setTimeout(() => inicio(), 2500); };
    const local = async () => { const h = knownHash(); if (!h) { m.className = 'msg'; m.textContent = 'Sin conexión con la hoja y esta computadora no tiene guardada la contraseña docente. Conéctate a internet o abre una vez el panel 🔒 Docente del simulador con internet.'; $('#dgo').disabled = false; return; }
      if (await sha256('TechKids-Sec·' + clave) !== h) { m.className = 'msg'; m.textContent = 'Contraseña incorrecta.'; $('#dgo').disabled = false; return; }
      store.outbox.push({ fecha: nowStamp(), grado: G.short, grupo, alumno: name, tema: 'EX', temaNombre: '', ejercicio: 'EXAMEN', titulo: '', calif: '', intento: '', mejor: '', promTema: '', temasComp: '', totalTemas: '', tipo: 'Reinicio docente (sin conexión)', dev: store.dev, texto: '' }); persist(); flush();
      listo(`✓ Examen reiniciado en esta computadora para ${name}. La hoja se actualizará cuando haya internet.`); };
    if (!online()) { local(); return; }
    try {
      const q = `accion=reiniciar&clave=${encodeURIComponent(clave)}&alumno=${encodeURIComponent(name)}&grupo=${encodeURIComponent(grupo)}&grado=${encodeURIComponent(G.short)}&ej=EXAMEN`;
      const d = await fetch(`${REPORT_URL}?${q}`).then((r) => r.json());
      if (!d || !d.ok) { m.className = 'msg'; m.textContent = (d && d.msg) || 'No se pudo reiniciar.'; $('#dgo').disabled = false; return; }
      if (d.id) store.resetsDone.push(d.id); store.claveHash = await sha256('TechKids-Sec·' + clave);
      listo(`✓ Examen reiniciado para ${name} (${grupo}). Ya puede presentarlo de nuevo.`);
    } catch (e) { local(); }
  });
}

inicio();
})();
</script>
</body>
</html>
